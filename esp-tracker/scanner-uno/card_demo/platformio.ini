; Standalone bench demo: RFID + RTC + LCD + buzzer, NO modem/SIM800L/network
; at all — copied verbatim from ../src/ (reader/card/clock/display/buzzer),
; same pattern as ../selftest_card/ and the other selftest_*/ folders. Exists
; because the full scanner firmware's GPRS diagnostics (modem.cpp's
; deliberately-left-in CGATT retry loop, see ../PLAN.md §1b) add real delay
; to every boot and tap cycle on marginal signal, which gets in the way when
; the thing actually being demoed is the card-read + LCD-name feature, not
; the cellular path. Once GPRS/signal is sorted, go back to the real
; ../src/main.cpp — this is a bench tool, not a replacement for it.

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps =
    miguelbalboa/MFRC522@^1.4.11
    makuna/RTC@^2.5.0
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
monitor_speed = 9600
