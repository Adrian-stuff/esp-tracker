; Standalone enrollment-station sketch — writes card.h's offline-fallback
; format onto blank MIFARE Classic 1K cards. Not part of the gate scanner
; firmware; flash this onto a spare Uno+RC522 (the same hardware already
; proven working in ../selftest_rfid/) or a spare ESP32 DevKit + RC522
; (env:esp32 below — same board model as ../tracker/, just breadboarded
; with an RC522 instead of the tracker's SIM800L/GPS) and leave it plugged
; into whatever PC runs card_writer_gui.py. See ../src/card.h for the wire
; format this must match byte-for-byte.

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps =
    miguelbalboa/MFRC522@^1.4.11
monitor_speed = 9600

; ESP32 DevKit v1 variant. RC522 wiring assumed to match ../scanner/'s
; proven pinout (its own RC522 is on ESP32 too, so this is the one
; already-working ESP32+RC522 hookup in this repo) — SS=5, RST=4, SPI on
; ESP32's hardware VSPI default pins (SCK=18, MISO=19, MOSI=23). RC522 is
; 3.3V ONLY, same warning as everywhere else it appears in this repo.
; If your board is wired differently, edit PIN_SS/PIN_RST/PIN_SCK/
; PIN_MISO/PIN_MOSI at the top of src/main.cpp before flashing.
[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    miguelbalboa/MFRC522@^1.4.11
monitor_speed = 9600
