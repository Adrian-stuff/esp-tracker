; Standalone enrollment-station sketch — writes card.h's offline-fallback
; format onto blank MIFARE Classic 1K cards. Not part of the gate scanner
; firmware; flash this onto a spare Uno+RC522 (the same hardware already
; proven working in ../selftest_rfid/) and leave it plugged into whatever
; PC runs card_writer_gui.py. See ../src/card.h for the wire format this
; must match byte-for-byte.

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps =
    miguelbalboa/MFRC522@^1.4.11
monitor_speed = 9600
