<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gate Attendance — scanner-uno</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-2: #fafbfc;
    --border: #e3e5e9;
    --text: #1a1d23;
    --text-dim: #6b7280;
    --text-faint: #9aa1ac;
    --accent: #2563eb;
    --accent-bg: #eff4ff;
    --good: #16a34a;
    --good-bg: #eefcf1;
    --bad: #dc2626;
    --bad-bg: #fef2f2;
    --radius-lg: 14px;
    --radius-sm: 8px;
    --shadow: 0 1px 2px rgba(20, 20, 30, 0.04), 0 1px 8px rgba(20, 20, 30, 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121316;
      --surface: #1b1d22;
      --surface-2: #202329;
      --border: #2c2f36;
      --text: #e9eaed;
      --text-dim: #a2a7b0;
      --text-faint: #6d7178;
      --accent: #6d97f7;
      --accent-bg: #1c2740;
      --good: #4ade80;
      --good-bg: #10261a;
      --bad: #f87171;
      --bad-bg: #2c1618;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 2px 10px rgba(0, 0, 0, 0.25);
    }
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    max-width: 980px;
    margin: 0 auto;
    padding: 1.75rem 1.25rem 4rem;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------------------------------------------------------- header --- */
  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
    margin-bottom: 1.5rem;
  }
  h1 { font-size: 1.4rem; font-weight: 700; margin: 0 0 0.3rem; letter-spacing: -0.01em; }
  .subtitle { font-size: 0.85rem; color: var(--text-dim); margin: 0; }

  .badge {
    display: inline-flex; align-items: center; gap: 0.45em;
    font-size: 0.8rem; font-weight: 600;
    padding: 0.35em 0.75em;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    white-space: nowrap;
  }
  .badge .dot { width: 0.55em; height: 0.55em; border-radius: 50%; background: var(--text-faint); flex: none; }
  .badge.on { color: var(--good); background: var(--good-bg); border-color: transparent; }
  .badge.on .dot { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 18%, transparent); }
  .badge.off { color: var(--bad); background: var(--bad-bg); border-color: transparent; }
  .badge.off .dot { background: var(--bad); }

  .headerRight { display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem; }
  .actionRow { display: flex; align-items: center; gap: 0.6rem; }

  button {
    font: inherit; font-size: 0.82rem; font-weight: 600;
    padding: 0.45em 0.9em;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover { background: var(--surface-2); border-color: var(--text-faint); }
  button:active { transform: translateY(1px); }
  .actionMsg { font-size: 0.78rem; color: var(--text-dim); min-height: 1.2em; }

  /* -------------------------------------------------------- stat row --- */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.85rem; margin-bottom: 1.75rem; }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 0.9rem 1.1rem;
    box-shadow: var(--shadow);
  }
  .stat .label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); font-weight: 600; margin-bottom: 0.3rem; }
  .stat .value { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; }
  .stat .value.small { font-size: 1rem; font-weight: 600; }
  .stat .hint { font-size: 0.75rem; color: var(--text-dim); margin-top: 0.15rem; }

  /* ------------------------------------------------------------ cards --- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    margin-bottom: 1.5rem;
    overflow: hidden;
  }
  .cardHead {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: 0.95rem 1.15rem;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .cardHead h2 { font-size: 0.95rem; font-weight: 700; margin: 0; }
  .cardHead .count { font-size: 0.78rem; color: var(--text-faint); font-weight: 600; }
  .search {
    font: inherit; font-size: 0.82rem;
    padding: 0.4em 0.75em;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    min-width: 180px;
  }
  .search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .search::placeholder { color: var(--text-faint); }

  .tableWrap { overflow-x: auto; max-height: 420px; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
  thead th {
    position: sticky; top: 0;
    text-align: left; font-weight: 600; font-size: 0.72rem;
    text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--text-faint);
    background: var(--surface);
    padding: 0.55em 1.15rem;
    border-bottom: 1px solid var(--border);
  }
  tbody td { padding: 0.65em 1.15rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--surface-2); }

  .who { display: flex; align-items: center; gap: 0.6em; }
  .avatar {
    width: 1.8em; height: 1.8em; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.72rem; font-weight: 700; color: white;
  }
  .name { font-weight: 600; }
  .noname { color: var(--text-faint); font-style: italic; font-weight: 500; }
  .time { color: var(--text-dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
  code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.78rem;
    color: var(--text-dim);
    background: var(--surface-2);
    padding: 0.15em 0.4em;
    border-radius: 4px;
  }
  .msgText { max-width: 360px; overflow-wrap: anywhere; }

  .empty { text-align: center; padding: 2.5rem 1rem; color: var(--text-faint); }
  .empty .icon { font-size: 1.6rem; display: block; margin-bottom: 0.4rem; opacity: 0.6; }
  .empty .sub { font-size: 0.8rem; margin-top: 0.2rem; }

  @keyframes rowIn {
    from { background-color: var(--accent-bg); }
    to   { background-color: transparent; }
  }
  tr.fresh { animation: rowIn 2.2s ease-out; }

  footer { text-align: center; font-size: 0.75rem; color: var(--text-faint); margin-top: 2rem; }

  @media (max-width: 640px) {
    .stats { grid-template-columns: 1fr; }
    header { flex-direction: column; }
    .headerRight { align-items: flex-start; width: 100%; }
    .cardHead { flex-direction: column; align-items: stretch; }
    .search { width: 100%; }
  }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Gate Attendance</h1>
      <p class="subtitle">Live view of scanner-uno's SMS-only firmware — see dashboard/README.md</p>
    </div>
    <div class="headerRight">
      <span id="statusBadge" class="badge off"><span class="dot"></span><span id="statusText">connecting…</span></span>
      <div class="actionRow">
        <button onclick="setClock()">Set scanner clock to now</button>
        <span id="clockMsg" class="actionMsg"></span>
      </div>
    </div>
  </header>

  <div class="stats">
    <div class="stat">
      <div class="label">Taps today</div>
      <div class="value" id="statTapsToday">—</div>
    </div>
    <div class="stat">
      <div class="label">Last tap</div>
      <div class="value small" id="statLastTap">—</div>
      <div class="hint" id="statLastTapTime"></div>
    </div>
    <div class="stat">
      <div class="label">Messages received</div>
      <div class="value" id="statMsgCount">—</div>
    </div>
  </div>

  <section class="card">
    <div class="cardHead">
      <h2>Attendance</h2>
      <input class="search" id="attendanceSearch" type="text" placeholder="Filter by name or UID…" oninput="renderAttendance()">
      <span class="count" id="attendanceCount"></span>
    </div>
    <div class="tableWrap">
      <table id="attendanceTable">
        <thead><tr><th>Time</th><th>Who</th><th>UID</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <div class="cardHead">
      <h2>Messages received</h2>
      <input class="search" id="messagesSearch" type="text" placeholder="Filter by sender or text…" oninput="renderMessages()">
      <span class="count" id="messagesCount"></span>
    </div>
    <div class="tableWrap">
      <table id="messagesTable">
        <thead><tr><th>Time</th><th>From</th><th>Text</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <footer>scanner-uno/dashboard — refreshes every 3s</footer>

<script>
let latestData = { attendance: [], messages: [] };
let knownTapKeys = new Set();
let knownMsgKeys = new Set();
let firstLoad = true;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

const AVATAR_COLORS = ["#2563eb", "#7c3aed", "#0891b2", "#c2410c", "#be185d", "#15803d", "#a16207"];
function colorFor(seed) {
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}

function timeAgo(epochSeconds) {
  const diff = Math.max(0, Math.floor(Date.now() / 1000) - epochSeconds);
  if (diff < 60) return "just now";
  if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
  return `${Math.floor(diff / 86400)}d ago`;
}

function renderAttendance() {
  const rows = latestData.attendance;
  const q = document.getElementById("attendanceSearch").value.trim().toLowerCase();
  const filtered = q ? rows.filter(r => (r.name || "").toLowerCase().includes(q) || r.uid.toLowerCase().includes(q)) : rows;
  document.getElementById("attendanceCount").textContent = rows.length ? `${filtered.length} of ${rows.length}` : "";

  const tbody = document.querySelector("#attendanceTable tbody");
  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="3"><div class="empty"><span class="icon">🪪</span>${rows.length ? "No matches" : "No taps yet"}<div class="sub">${rows.length ? "Try a different search" : "Tap an enrolled card to see it appear here"}</div></div></td></tr>`;
    return;
  }
  tbody.innerHTML = filtered.map(r => {
    const key = `${r.uid}-${r.epoch}`;
    const isFresh = !firstLoad && !knownTapKeys.has(key);
    const initial = (r.name || r.uid).trim()[0].toUpperCase();
    return `
    <tr class="${isFresh ? "fresh" : ""}">
      <td class="time">${escapeHtml(r.time_ph)}</td>
      <td>
        <div class="who">
          <span class="avatar" style="background:${colorFor(r.name || r.uid)}">${escapeHtml(initial)}</span>
          ${r.name ? `<span class="name">${escapeHtml(r.name)}</span>` : '<span class="noname">not enrolled</span>'}
        </div>
      </td>
      <td><code>${escapeHtml(r.uid)}</code></td>
    </tr>`;
  }).join("");
}

function renderMessages() {
  const rows = latestData.messages;
  const q = document.getElementById("messagesSearch").value.trim().toLowerCase();
  const filtered = q ? rows.filter(r => r.from.toLowerCase().includes(q) || r.text.toLowerCase().includes(q)) : rows;
  document.getElementById("messagesCount").textContent = rows.length ? `${filtered.length} of ${rows.length}` : "";

  const tbody = document.querySelector("#messagesTable tbody");
  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="3"><div class="empty"><span class="icon">💬</span>${rows.length ? "No matches" : "No messages yet"}<div class="sub">${rows.length ? "Try a different search" : "SMS sent to the scanner's number will appear here"}</div></div></td></tr>`;
    return;
  }
  tbody.innerHTML = filtered.map(r => {
    const key = `${r.received_at}-${r.from}-${r.text}`;
    const isFresh = !firstLoad && !knownMsgKeys.has(key);
    return `
    <tr class="${isFresh ? "fresh" : ""}">
      <td class="time">${escapeHtml(r.received_at)}</td>
      <td><code>${escapeHtml(r.from)}</code></td>
      <td class="msgText">${escapeHtml(r.text)}</td>
    </tr>`;
  }).join("");
}

function updateStats() {
  const { attendance, messages } = latestData;
  const todayStart = new Date(); todayStart.setHours(0, 0, 0, 0);
  const todayCount = attendance.filter(r => r.epoch * 1000 >= todayStart.getTime()).length;
  document.getElementById("statTapsToday").textContent = todayCount;

  if (attendance.length) {
    const last = attendance[0];
    document.getElementById("statLastTap").textContent = last.name || last.uid;
    document.getElementById("statLastTapTime").textContent = timeAgo(last.epoch);
  } else {
    document.getElementById("statLastTap").textContent = "—";
    document.getElementById("statLastTapTime").textContent = "";
  }
  document.getElementById("statMsgCount").textContent = messages.length;
}

async function poll() {
  try {
    const res = await fetch("/api/events");
    const data = await res.json();
    const badge = document.getElementById("statusBadge");
    const text = document.getElementById("statusText");
    badge.className = "badge " + (data.connected ? "on" : "off");
    text.textContent = data.connected ? `Connected — ${data.port}` : "Scanner not connected";

    latestData = data;
    renderAttendance();
    renderMessages();
    updateStats();

    knownTapKeys = new Set(data.attendance.map(r => `${r.uid}-${r.epoch}`));
    knownMsgKeys = new Set(data.messages.map(r => `${r.received_at}-${r.from}-${r.text}`));
    firstLoad = false;
  } catch (e) {
    document.getElementById("statusBadge").className = "badge off";
    document.getElementById("statusText").textContent = "Dashboard server unreachable";
  }
}

async function setClock() {
  const msg = document.getElementById("clockMsg");
  msg.textContent = "Setting…";
  try {
    const res = await fetch("/api/set_clock", { method: "POST" });
    const data = await res.json();
    msg.textContent = data.sent ? "✓ Clock set" : "Scanner not connected";
  } catch (e) {
    msg.textContent = "Failed";
  }
  setTimeout(() => { msg.textContent = ""; }, 3000);
}

poll();
setInterval(poll, 3000);
</script>
</body>
</html>
