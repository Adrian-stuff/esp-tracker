; Arduino Uno scanner — cellular-only fallback. See ../PLAN.md §1b for why
; this exists: both ESP32 boards on hand failed independent hardware
; diagnosis; the Uno is the one MCU confirmed working end to end.

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps =
    miguelbalboa/MFRC522@^1.4.11
    makuna/RTC@^2.5.0
    rweather/Crypto@^0.4.0
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
; Default Serial RX/TX ring buffers (64 bytes each on this core) are sized
; for a USB-speed link the debug console doesn't need — this build is RAM-
; constrained enough that trimming them is worth the smaller margin.
; TWI_BUFFER_LENGTH is guarded by #ifndef in the framework's twi.h, so this
; is a safe, supported override — halves twi.c's 3 internal buffers
; (96 -> 48 bytes). Our actual I2C traffic (LCD commands) never sends more
; than a handful of bytes per transaction, nowhere near even 16.
build_flags =
    -Os
    -DSERIAL_RX_BUFFER_SIZE=16
    -DSERIAL_TX_BUFFER_SIZE=16
    -D_SS_MAX_RX_BUFF=32
    -DTWI_BUFFER_LENGTH=16
