; Uno scanner — connection self-test. Flash this BEFORE the real firmware in
; ../ (scanner-uno/): it exercises each peripheral on its own and says
; plainly what it found, so a fault points at one module instead of
; presenting as "nothing works".
;
; Unlike the ESP32 build's selftest, this needs no auto-reset workaround —
; a genuine Uno's DTR-driven reset already works on this machine (that's
; the whole reason the Uno fallback exists — see PLAN.md §1b).

[env:uno_selftest]
platform  = atmelavr
board     = uno
framework = arduino
monitor_speed = 115200
lib_deps =
    miguelbalboa/MFRC522@^1.4.11
    adafruit/RTClib@^2.1.4
; A first cut of this build hit 97.5% static RAM (1997/2048) — dangerously
; tight for a diagnostic tool that's supposed to be the reliable thing.
; These trims, plus removing String in favor of fixed buffers in main.cpp,
; brought it down to a real margin. See main.cpp's simCmd() comment.
; Wire's own 32-byte buffers (TWI_BUFFER_LENGTH / BUFFER_LENGTH in the
; framework's Wire.h) are a hard #define, not guarded by #ifndef — cannot be
; overridden from here without patching the installed framework file, which
; is too fragile to do for a diagnostic tool (a platform update would
; silently drop it). ~160 bytes of the total below is Wire/twi buffers this
; build has no lever over.
build_flags =
    -Os
    -DSERIAL_RX_BUFFER_SIZE=8
    -DSERIAL_TX_BUFFER_SIZE=8
    -D_SS_MAX_RX_BUFF=32
