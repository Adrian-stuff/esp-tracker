; Standalone test: verifies the SCANNER firmware's actual card::read() path
; (card.cpp + reader.cpp, copied verbatim from ../src/ — not reimplemented)
; against a real card written by ../card_writer/. Confirms the two halves of
; the offline-fallback feature actually agree on the wire format, on real
; hardware, not just by code inspection. See ../PLAN.md's card-format
; section for what this feature is and why it exists.
;
; clock.cpp is included only because reader.cpp's poll() references it and
; the linker needs a definition to exist — this test never calls poll() (it
; drives the RC522 directly via reader::instance() to skip the DS1302
; dependency entirely), so clock.cpp's code never actually runs here.

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps =
    miguelbalboa/MFRC522@^1.4.11
    makuna/RTC@^2.5.0
monitor_speed = 9600
