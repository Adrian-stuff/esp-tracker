; I2C-only isolation test — DS3231 clock + PCA9633 LED, nothing else loaded
; (no MFRC522, no SoftwareSerial). Part of the per-peripheral split; see
; ../selftest_sim_only/platformio.ini for why this split happened — the
; combined selftest/ sat at 94.6% static RAM, tight enough to make its own
; results unreliable.

[env:i2c_only]
platform  = atmelavr
board     = uno
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/RTClib@^2.1.4
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
build_flags = -Os
