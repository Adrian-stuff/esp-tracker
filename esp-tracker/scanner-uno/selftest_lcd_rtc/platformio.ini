; LCD + DS1302 ONLY — nothing else (no RC522, no SoftwareSerial/SIM800L, no
; buzzer). Bisecting whether the main firmware's crash inside
; display::begin() needs the full harness, or happens with just these two.

[env:lcd_rtc]
platform  = atmelavr
board     = uno
framework = arduino
monitor_speed = 115200
lib_deps =
    makuna/RTC@^2.5.0
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
build_flags = -Os
