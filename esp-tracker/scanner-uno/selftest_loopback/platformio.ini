; SoftwareSerial self-loopback test on pins 7/8 — isolates whether the
; Uno's own pins/SoftwareSerial are the fault, independent of any external
; module. Jumper pin 7 to pin 8 directly, nothing else connected.

[env:loopback]
platform  = atmelavr
board     = uno
framework = arduino
monitor_speed = 115200
build_flags = -Os
