; Minimal AT-modem isolation test — proven on both SIM900 (dead) and SIM800L (working) — deliberately loads NOTHING else (no RTClib, no
; MFRC522, no Wire) to isolate whether the reset loop seen in the combined
; selftest is caused by RAM/stack pressure from loading every peripheral
; driver at once, or is a genuine power/wiring issue independent of that.

[env:sim_only]
platform  = atmelavr
board     = uno
framework = arduino
monitor_speed = 115200
build_flags = -Os
