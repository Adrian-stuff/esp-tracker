; SMS-only gate scanner — a fresh firmware, not a fork of ../src/. It drops
; every GPRS/HTTP code path (net.cpp, relay.cpp, roster.cpp, and
; modem.cpp's AT+CIPSTART/CIPSEND/+IPD-framing layer) because GPRS_ENABLED
; has been false on the real ../src/ build since GPRS attach was confirmed
; failing on the bench signal — that code was already 100% dead at
; runtime, just not at compile time or in RAM/flash. See ../README.md for
; the full rationale and the path back to GPRS later.
;
; reader/card/clock/display/buzzer are copied verbatim from ../src/ (same
; pattern ../card_demo/ and ../selftest_*/ already use) — those are already
; hardware-verified; re-deriving them here would only add risk for no gain.

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps =
    miguelbalboa/MFRC522@^1.4.11
    makuna/RTC@^2.5.0
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
; Same RAM-margin lessons as ../platformio.ini (see its comment and
; ../PLAN.md §1b's "Status" section for why every one of these was tuned
; against a real reset loop, not guessed): a USB-speed serial ring buffer
; isn't needed for a 9600-baud debug console, and this build's actual I2C
; traffic (LCD commands) never exceeds a handful of bytes per transaction.
build_flags =
    -Os
    -DSERIAL_RX_BUFFER_SIZE=16
    -DSERIAL_TX_BUFFER_SIZE=16
    -D_SS_MAX_RX_BUFF=32
    -DTWI_BUFFER_LENGTH=16
monitor_speed = 9600
