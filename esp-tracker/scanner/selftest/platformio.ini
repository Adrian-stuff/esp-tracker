; Gate scanner — connection self-test.
;
; Two upload environments, because auto-reset does not currently work on this
; Mac (both a CH340 board and a CP2102 DevKitC fail identically, while an
; Arduino Uno on the same machine is fine — so the DTR/RTS lines that drive
; EN and IO0 are not doing their job).
;
;   selftest         normal auto-reset. Use this once the machine behaves.
;   selftest_manual  skips the reset entirely: put the chip in download mode
;                    yourself first, then upload.
;
; To use selftest_manual:
;   1. jumper IO0 to GND (or hold BOOT, tap EN, release both)
;   2. pio run -e selftest_manual -t upload
;   3. remove the jumper and tap EN to run it

[common]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    miguelbalboa/MFRC522 @ ^1.4.11
    adafruit/RTClib @ ^2.1.4

[env:selftest]
extends = common
upload_speed = 115200
upload_port  = /dev/cu.usbserial-0001

[env:selftest_manual]
extends = common
upload_speed = 115200
upload_port  = /dev/cu.usbserial-0001
; --before no_reset: do not touch DTR/RTS at all, just talk to a chip that is
; already sitting in the ROM bootloader.
upload_flags =
    --before
    no_reset
    --after
    hard_reset
