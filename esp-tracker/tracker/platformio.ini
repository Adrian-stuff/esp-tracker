[env:tracker]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed  = 921600

; min_spiffs.csv: two 1.4MB OTA slots (app0/app1) — enables firmware upload
; via the WiFi captive portal's /update route. No SPIFFS partition (the
; config page is inline HTML, preferences use NVS — nothing needs SPIFFS).
; Previous huge_app.csv (single 3MB slot) was chosen when the app was
; ~97% of the original 1.25MB default slot; the current binary fits
; comfortably in 1.4MB with room to grow.
board_build.partitions = min_spiffs.csv

build_flags =
    -D CORE_DEBUG_LEVEL=3

; TinyGSM, ArduinoHttpClient, and SSLClient dropped (2026-08-31): they
; backed the GPRS/cellular-TLS uplink modem.cpp never actually implemented
; past a commented-out sketch, and now won't — see modem.cpp's file header
; for why (this SIM800L's 2G is confirmed dead by the Philippines'
; NTC-mandated shutdown). Routine location over SMS (report.cpp) needs
; none of these. mbedTLS (sha256) ships with the espressif32 platform
; itself, so no new dependency replaces those three.
;
; ArduinoJson is BACK (re-added) for wifi_uplink.cpp — a real WiFi+HTTPS
; path direct to Supabase, not the abandoned cellular one above. Uses the
; ESP32's own WiFi + WiFiClientSecure + HTTPClient (all ship with the
; espressif32 Arduino core), not the modem/TinyGsm stack at all.
;
; HTTPUpdateServer (also ships with espressif32 Arduino core) provides
; OTA firmware upload through the WiFi captive portal's /update route —
; no extra dependency needed.
lib_deps =
    mikalhart/TinyGPSPlus @ ^1.0.3
    h2zero/NimBLE-Arduino @ ^1.4.0
    bblanchon/ArduinoJson @ ^7.0.0
