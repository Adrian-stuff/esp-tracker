[env:tracker]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed  = 921600

build_flags =
    -D CORE_DEBUG_LEVEL=3

; TinyGSM, ArduinoHttpClient, SSLClient, and ArduinoJson dropped
; (2026-08-31): they backed the GPRS/HTTP/TLS uplink modem.cpp never
; actually implemented past a commented-out sketch, and now won't — see
; modem.cpp's file header for why (this SIM800L's 2G is confirmed dead by
; the Philippines' NTC-mandated shutdown, same hardware as the gate
; scanner's already-tested modem). Routine location now goes over SMS
; (report.cpp), which needs none of these. mbedTLS (sha256) ships with the
; espressif32 platform itself, so no new dependency replaces them.
lib_deps =
    mikalhart/TinyGPSPlus @ ^1.0.3
