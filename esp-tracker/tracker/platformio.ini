[env:tracker]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed  = 921600

; huge_app.csv: one 3MB app slot instead of default.csv's two 1.25MB OTA
; slots. This project reflashes via USB/esptool, not OTA — wifi_uplink.cpp
; (WiFiClientSecure + HTTPClient + ArduinoJson, a real TLS stack) pushed
; flash usage to 96.9% of the default 1.25MB partition, ~40KB of headroom.
; That's too tight to safely add anything else. huge_app.csv drops usage
; to ~40% of 3MB instead, with real room to grow.
board_build.partitions = huge_app.csv

build_flags =
    -D CORE_DEBUG_LEVEL=3

; TinyGSM, ArduinoHttpClient, and SSLClient dropped (2026-08-31): they
; backed the GPRS/cellular-TLS uplink modem.cpp never actually implemented
; past a commented-out sketch, and now won't — see modem.cpp's file header
; for why (this SIM800L's 2G is confirmed dead by the Philippines'
; NTC-mandated shutdown). Routine location over SMS (report.cpp) needs
; none of these. mbedTLS (sha256) ships with the espressif32 platform
; itself, so no new dependency replaces those three.
;
; ArduinoJson is BACK (re-added) for wifi_uplink.cpp — a real WiFi+HTTPS
; path direct to Supabase, not the abandoned cellular one above. Uses the
; ESP32's own WiFi + WiFiClientSecure + HTTPClient (all ship with the
; espressif32 Arduino core), not the modem/TinyGsm stack at all.
lib_deps =
    mikalhart/TinyGPSPlus @ ^1.0.3
    h2zero/NimBLE-Arduino @ ^1.4.0
    bblanchon/ArduinoJson @ ^7.0.0
